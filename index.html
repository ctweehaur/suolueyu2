<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缩略语学习卡</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f6f5f2;
            color: #4a4540; 
            -webkit-tap-highlight-color: transparent;
        }
        .word-title { 
            font-family: 'Noto Serif SC', serif; 
        }
        .animate-bounce {
            animation: toastBounce 0.5s ease;
        }
        @keyframes toastBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 3D 闪卡核心翻转 */
        #card-container {
            perspective: 1200px;
            user-select: none;
            cursor: pointer;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            width: 100%;
            height: 100%;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border-radius: 1.5rem;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .backface-hidden::-webkit-scrollbar {
            display: none;
        }
        #flip-card > div:nth-child(2) {
            transform: rotateY(180deg);
        }

        /* 文本与拼音排版 */
        #card-word-ruby {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem 0.5rem;
            box-sizing: border-box;
            min-height: 100%;
        }
        .ruby-phrase-block {
            display: inline-flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-end;
            margin: 3px 6px;
        }
        ruby.ruby-char-unit {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin: 0 1.5px;
            vertical-align: bottom;
        }
        ruby.ruby-char-unit rt {
            user-select: none;
            line-height: 1.1;
            text-transform: lowercase;
            letter-spacing: 0;
            font-variant-east-asian: normal;
        }

        /* 按钮与测试系统 */
        button:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }
        #quiz-question-word {
            word-break: break-word;
            white-space: normal;
        }
        #prev-btn, #next-btn {
            transition: all 0.3s ease;
            user-select: none;
        }
        #prev-btn:hover:not(:disabled), #next-btn:hover:not(:disabled) {
            transform: scale(1.1);
            border-color: #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        #prev-btn:active:not(:disabled), #next-btn:active:not(:disabled) {
            transform: scale(0.9);
        }
        #prev-btn:disabled, #next-btn:disabled {
            cursor: not-allowed;
            opacity: 0.3;
            transform: none !important;
        }
        #card-counter {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-start select-none">

    <div id="app" class="w-full max-w-lg pt-4 flex flex-col">
        <!-- 标题 -->
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-stone-700 tracking-wide word-title">缩略语2</h1>
            <div class="mt-3 bg-stone-200/60 rounded-full h-2 w-full overflow-hidden flex">
                <div id="mastery-progress-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="mastery-status" class="text-[10px] text-stone-400 mt-1.5 font-mono tracking-wider">已掌握 0 / 0 词 (0%)</p>
        </header>

        <!-- 功能按钮 -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="startWeaknessTraining()" class="bg-white border border-stone-200 py-3 px-2 rounded-xl shadow-sm text-center text-stone-700 text-xs font-semibold hover:bg-stone-50 transition-all flex items-center justify-center gap-1.5">
                🎯 开启错题专项训练 (<span class="text-amber-600 font-bold" id="wrong-count">0</span>)
            </button>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-amber-500 to-orange-500 text-white py-3 px-2 rounded-xl shadow-md text-xs font-semibold hover:from-amber-600 hover:to-orange-600 transition-all flex items-center justify-center gap-1.5">
                📝 开始小测验
            </button>
        </div>

        <!-- 卡片容器 + 左右导航 -->
        <div class="relative flex items-center w-full mb-4">
            <button onclick="prevCard()" id="prev-btn" class="absolute left-0 z-10 bg-white/80 backdrop-blur-sm hover:bg-white border-2 border-stone-200 hover:border-amber-400 text-stone-700 w-10 h-10 rounded-full shadow-md transition-all flex items-center justify-center text-lg -ml-2">
                ◀
            </button>
            
            <div id="card-container" class="w-full h-[420px] sm:h-[440px] cursor-pointer relative mx-8">
                <div id="flip-card" class="w-full h-full relative transform-style-3d">
                    
                    <!-- 卡片正面 -->
                    <div class="absolute inset-0 bg-white rounded-2xl border border-stone-100 shadow-xl shadow-stone-200/50 flex items-center justify-center p-4 backface-hidden overflow-y-auto">
                        <div id="card-word-ruby" class="word-title w-full tracking-wide select-none"></div>
                    </div>

                    <!-- 卡片反面 -->
                    <div class="absolute inset-0 bg-orange-50/40 rounded-2xl border-2 border-orange-100/60 shadow-xl shadow-stone-200/50 flex flex-col p-5 backface-hidden overflow-y-auto">
                        <div class="absolute inset-2 border border-amber-900/5 rounded-xl pointer-events-none"></div>

                        <div class="relative z-10 flex flex-col justify-between min-h-full py-1">
                            <div>
                                <div class="inline-flex items-center gap-1 bg-amber-700/10 text-amber-800 text-[10px] font-bold tracking-wider px-2 py-0.5 rounded-md mb-1.5">
                                    <span>华文释义</span>
                                </div>
                                <div id="card-def-zh" class="text-[14px] font-medium text-stone-800 leading-relaxed pl-1">暂无释义</div>
                            </div>

                            <div class="grid grid-cols-2 gap-3 border-t border-b border-amber-900/5 py-2.5 my-2">
                                <div>
                                    <div class="inline-flex items-center gap-1 bg-sky-100/60 text-sky-800 text-[9px] font-bold tracking-wider px-1.5 py-0.5 rounded mb-1">
                                        <span>ENGLISH</span>
                                    </div>
                                    <p id="card-def-en" class="text-[11px] italic text-sky-900/70 leading-snug pl-0.5">No translation.</p>
                                </div>
                                <div>
                                    <div class="inline-flex items-center gap-1 bg-rose-100/60 text-rose-800 text-[9px] font-bold tracking-wider px-1.5 py-0.5 rounded mb-1">
                                        <span>MELAYU</span>
                                    </div>
                                    <p id="card-def-bm" class="text-[11px] text-rose-900/70 leading-snug pl-0.5 font-medium">Tiada terjemahan.</p>
                                </div>
                            </div>

                            <div class="bg-white/80 border border-amber-950/5 p-3.5 rounded-xl shadow-sm mt-1">
                                <div class="inline-flex items-center gap-1 bg-amber-900/5 text-amber-900/70 text-[10px] font-bold tracking-wider px-1.5 py-0.5 rounded mb-1.5">
                                    <span>例句</span>
                                </div>
                                <p id="card-example" class="text-stone-700 text-[13px] font-medium leading-relaxed pl-0.5 tracking-wide">暂无例句。</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <button onclick="nextCard()" id="next-btn" class="absolute right-0 z-10 bg-white/80 backdrop-blur-sm hover:bg-white border-2 border-stone-200 hover:border-amber-400 text-stone-700 w-10 h-10 rounded-full shadow-md transition-all flex items-center justify-center text-lg -mr-2">
                ▶
            </button>
        </div>

        <!-- 进度计数器 -->
        <div class="text-center mb-3">
            <span id="card-counter" class="text-xs text-stone-400 font-mono">0 / 0</span>
        </div>

        <!-- 掌握控制按钮 -->
        <div class="w-full flex flex-col items-center gap-3">
            <div class="grid grid-cols-2 gap-4 w-full">
                <button onclick="markMastery(false)" class="bg-white border-2 border-stone-200 hover:border-red-400 hover:bg-red-50/30 text-stone-700 py-3 px-6 rounded-xl font-semibold shadow-sm transition-all text-center text-sm flex items-center justify-center gap-2">
                    ❌ 待加强
                </button>
                <button onclick="markMastery(true)" class="bg-stone-800 hover:bg-stone-900 text-white py-3 px-6 rounded-xl font-semibold shadow-md transition-all text-center text-sm flex items-center justify-center gap-2">
                    ✅ 已掌握
                </button>
            </div>
            <p id="progress-indicator" class="text-[11px] text-stone-400 font-mono tracking-wider">进度：0 / 0</p>
        </div>
    </div>

    <!-- Toast 消息容器 -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Quiz 弹窗 -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center hidden z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 relative flex flex-col max-h-[90vh]">
            <button onclick="closeQuiz()" class="absolute top-3 right-3 text-stone-400 hover:text-stone-600 text-xl font-bold transition-colors">&times;</button>
            <div class="border-b border-stone-100 pb-2 mb-3">
                <h3 class="text-base font-bold text-stone-800 flex items-center gap-1" id="quiz-title-text">🎯 缩略语测验</h3>
                <div class="w-full bg-stone-100 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div id="quiz-progress-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="quiz-q-num" class="text-[10px] text-stone-400 mt-1 font-mono">题目 1 / 5</p>
            </div>
            <div class="flex-1 overflow-y-auto mb-1 pr-1">
                <div id="quiz-question-container">
                    <h4 id="quiz-question-word" class="text-xl font-serif font-bold text-stone-800 text-center my-3 tracking-wide">-</h4>
                    <div id="quiz-options" class="space-y-2"></div>
                </div>
                <div id="quiz-result-container" class="hidden text-center py-6">
                    <span class="text-4xl block animate-bounce">🏆</span>
                    <h4 class="text-xl font-bold text-stone-800 mt-3">测验圆满结束！</h4>
                    <p id="quiz-score" class="text-3xl font-black text-amber-600 my-3">0 / 5</p>
                    <p id="quiz-eval" class="text-xs text-stone-500 mb-5 px-4">完成得不错！</p>
                    <button onclick="startQuiz()" class="w-full py-2.5 bg-stone-800 text-white rounded-xl text-sm font-medium hover:bg-stone-900 transition-colors">
                        再考一次
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==============================================================
         内置完整业务逻辑 (Script)
         ============================================================== -->
    <script>
    let currentPlan = [];
    let currentIndex = 0;
    let isFlipped = false;
    let isWeaknessMode = false;

    let quizQuestions = [];
    let quizCurrentIndex = 0;
    let quizScore = 0;
    let quizHistory = [];
    let quizRound = 0;

    function splitWordItem(rawWord) {
        if (!rawWord || typeof rawWord !== 'string') {
            return { question: "未知题目", answer: "" };
        }
        if (rawWord.includes("=")) {
            const parts = rawWord.split("=");
            return {
                question: (parts[0] || "").trim(),
                answer: (parts[1] || "").trim()
            };
        }
        return { question: rawWord.trim(), answer: rawWord.trim() };
    }

    function initApp() {
        try {
            let wrongList = JSON.parse(localStorage.getItem('vocabulary_wrong_list')) || [];
            updateWeaknessButton(wrongList.length);

            // 直接读取内置的 vocabularyData
            currentPlan = [...vocabularyData].sort(() => 0.5 - Math.random());
            currentIndex = 0;
            isWeaknessMode = false;
            
            quizHistory = [];
            quizRound = 0;
            
            setupFlipEvent();
            renderCard();
            updateMasteryProgress();
            updateNavButtons();
        } catch (error) {
            console.error("初始化失败:", error);
        }
    }

    function renderCard() {
        if (!currentPlan || currentPlan.length === 0) {
            showEmptyState();
            updateNavButtons();
            return;
        }
        if (currentIndex >= currentPlan.length) { currentIndex = 0; }
        if (currentIndex < 0) { currentIndex = 0; }

        const currentWord = currentPlan[currentIndex] || {};
        const flipCardEl = document.getElementById('flip-card');
        if (flipCardEl) flipCardEl.classList.remove('rotate-y-180');
        isFlipped = false;

        const { question, answer } = splitWordItem(currentWord.word);

        // 正面渲染
        const rubyContainer = document.getElementById('card-word-ruby');
        if (rubyContainer) {
            const rawPinyin = (currentWord.pinyin || "").split("=")[0].trim();
            const pinyinTokens = rawPinyin ? rawPinyin.split(/\s+/).filter(Boolean) : [];
            const pureChineseChars = question.replace(/\s+/g, '');
            
            let charSize = "text-3xl sm:text-4xl";
            let pySize = "text-xs sm:text-sm";
            if (pureChineseChars.length > 14) {
                charSize = "text-base sm:text-lg";
                pySize = "text-[10px] sm:text-xs";
            } else if (pureChineseChars.length > 8) {
                charSize = "text-xl sm:text-2xl";
                pySize = "text-xs";
            }

            let phraseList = question.trim().split(/\s+/).filter(Boolean);
            if (phraseList.length === 1 && phraseList[0].length > 6) {
                const fullStr = phraseList[0];
                phraseList = [];
                for (let k = 0; k < fullStr.length; k += 4) {
                    phraseList.push(fullStr.slice(k, k + 4));
                }
            }

            let tokenIndex = 0;
            let rubyHtml = `<div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-4 max-w-full px-2">`;

            phraseList.forEach(phrase => {
                rubyHtml += `<div class="inline-flex items-end justify-center flex-nowrap mx-0.5">`;
                for (let i = 0; i < phrase.length; i++) {
                    const char = phrase[i];
                    const py = pinyinTokens[tokenIndex] || "";
                    tokenIndex++;

                    rubyHtml += `
                        <ruby class="inline-flex flex-col items-center mx-0.5">
                            <rt class="${pySize} text-stone-400 font-sans font-medium mb-1 select-none leading-none">${py}</rt>
                            <span class="font-serif font-bold ${charSize} text-stone-800 leading-tight">${char}</span>
                        </ruby>
                    `;
                }
                rubyHtml += `</div>`;
            });

            rubyHtml += `</div>`;
            rubyHtml += `
                <div class="w-full text-center mt-4 text-[11px] text-stone-400 font-sans tracking-normal">
                    👆 概述原句 · 点击卡片翻看【提炼缩略词】
                </div>
            `;

            rubyContainer.innerHTML = rubyHtml;
        }

        // 反面渲染
        const defZhEl = document.getElementById('card-def-zh');
        if (defZhEl) {
            if (answer) {
                defZhEl.innerHTML = `
                    <div class="mb-2 pb-2 border-b border-stone-200">
                        <span class="text-[10px] font-sans font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">概述提炼答案</span>
                        <div class="text-2xl sm:text-3xl font-serif font-bold text-emerald-600 mt-1">${answer}</div>
                    </div>
                    <div class="text-stone-700 text-xs sm:text-sm leading-relaxed">${currentWord.defZh || '暂无释义'}</div>
                `;
            } else {
                defZhEl.innerText = currentWord.defZh || '暂无释义';
            }
        }

        const defEnEl = document.getElementById('card-def-en');
        if (defEnEl) defEnEl.innerText = currentWord.defEn || 'No English translation available.';

        const defBmEl = document.getElementById('card-def-bm');
        if (defBmEl) defBmEl.innerText = currentWord.defBm || 'Tiada terjemahan.';

        const exampleEl = document.getElementById('card-example');
        if (exampleEl) {
            let exampleText = currentWord.example || '暂无例句。';
            const cleanQuestion = question.replace(/\s+/g, '');
            const targetWord = answer || cleanQuestion;
            if (targetWord && exampleText.includes(targetWord)) {
                exampleText = exampleText.replace(targetWord, `______`);
            }
            exampleEl.innerText = exampleText;
        }

        const progressEl = document.getElementById('progress-indicator');
        if (progressEl) {
            progressEl.innerText = `进度：${currentIndex + 1} / ${currentPlan.length} ${isWeaknessMode ? '（错题训练中）' : ''}`;
        }

        updateNavButtons();
    }

    function setupFlipEvent() {
        const container = document.getElementById('card-container');
        const flipCardEl = document.getElementById('flip-card');
        if (container && flipCardEl) {
            container.onclick = null;
            container.onclick = function() {
                isFlipped = !isFlipped;
                flipCardEl.classList.toggle('rotate-y-180', isFlipped);
            };
        }
    }

    function prevCard() {
        if (!currentPlan || currentPlan.length === 0) return;
        currentIndex = (currentIndex === 0) ? currentPlan.length - 1 : currentIndex - 1;
        const flipCardEl = document.getElementById('flip-card');
        if (flipCardEl && isFlipped) {
            flipCardEl.classList.remove('rotate-y-180');
            isFlipped = false;
        }
        renderCard();
    }

    function nextCard() {
        if (!currentPlan || currentPlan.length === 0) return;
        currentIndex = (currentIndex === currentPlan.length - 1) ? 0 : currentIndex + 1;
        const flipCardEl = document.getElementById('flip-card');
        if (flipCardEl && isFlipped) {
            flipCardEl.classList.remove('rotate-y-180');
            isFlipped = false;
        }
        renderCard();
    }

    function updateNavButtons() {
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const counter = document.getElementById('card-counter');
        const total = currentPlan ? currentPlan.length : 0;
        
        if (prevBtn) {
            prevBtn.disabled = total === 0;
            prevBtn.style.opacity = total === 0 ? '0.3' : '1';
        }
        if (nextBtn) {
            nextBtn.disabled = total === 0;
            nextBtn.style.opacity = total === 0 ? '0.3' : '1';
        }
        if (counter) {
            counter.innerText = total > 0 ? `${currentIndex + 1} / ${total}` : '0 / 0';
        }
    }

    function markMastery(isMastered) {
        if (!currentPlan || currentPlan.length === 0) return;
        
        const currentWord = currentPlan[currentIndex];
        let wrongList = JSON.parse(localStorage.getItem('vocabulary_wrong_list')) || [];
        const currentWordText = currentWord.word || '';

        if (!isMastered) {
            if (!wrongList.some(item => item.word === currentWordText)) { 
                wrongList.push(currentWord); 
            }
            showToast("📌 已加入待加强训练库");
        } else {
            wrongList = wrongList.filter(item => item.word !== currentWordText);
            showToast("🎉 太棒了，这个词已经熟练掌握！");
        }

        localStorage.setItem('vocabulary_wrong_list', JSON.stringify(wrongList));
        updateWeaknessButton(wrongList.length);
        updateMasteryProgress();
        nextCard();
    }

    function startWeaknessTraining() {
        const wrongList = JSON.parse(localStorage.getItem('vocabulary_wrong_list')) || [];
        if (wrongList.length === 0) {
            showToast("✨ 赞！当前没有待加强的生词！");
            return;
        }
        isWeaknessMode = true;
        currentPlan = [...wrongList].sort(() => 0.5 - Math.random()); 
        currentIndex = 0;
        renderCard();
    }

    function updateWeaknessButton(count) {
        const btn = document.querySelector('button[onclick="startWeaknessTraining()"]');
        if (btn) btn.innerHTML = `🎯 开启错题专项训练 (<span class="text-amber-600 font-bold">${count}</span>)`;
        const countEl = document.getElementById('wrong-count');
        if (countEl) countEl.innerText = count;
    }

    function showEmptyState() {
        const rubyContainer = document.getElementById('card-word-ruby');
        if (rubyContainer) rubyContainer.innerHTML = `<span class="text-base text-stone-400">暂无生词数据</span>`;
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const bgClass = type === 'success' ? 'bg-stone-800 text-white' : 'bg-red-50 border border-red-200 text-red-800';
        toast.className = `${bgClass} px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold tracking-wide flex items-center gap-1.5 animate-bounce pointer-events-auto transition-all duration-300 z-50`;
        toast.innerHTML = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.add('opacity-0', '-translate-y-2');
            setTimeout(() => { toast.remove(); }, 300);
        }, 2500);
    }

    function updateMasteryProgress() {
        if (!vocabularyData || vocabularyData.length === 0) return;
        
        let wrongList = JSON.parse(localStorage.getItem('vocabulary_wrong_list')) || [];
        const totalWords = vocabularyData.length;
        const wrongCount = wrongList.length;
        const masteredCount = Math.max(0, totalWords - wrongCount);
        const percent = totalWords > 0 ? Math.round((masteredCount / totalWords) * 100) : 0;
        
        const bar = document.getElementById('mastery-progress-bar');
        if (bar) bar.style.width = `${percent}%`;
        const txt = document.getElementById('mastery-status');
        if (txt) txt.innerText = `已掌握 ${masteredCount} / ${totalWords} 词 (${percent}%)`;
    }

    function startQuiz() {
        if (!vocabularyData || vocabularyData.length < 4) {
            showToast("⚠️ 生词数量不足 4 个，无法生成选择题！", "error");
            return;
        }

        const availableWords = vocabularyData.filter(item => !quizHistory.includes(item.word));
        if (availableWords.length === 0) {
            quizHistory = [];
            quizRound++;
            showToast(`🔄 第 ${quizRound} 轮完成！开始新一轮测试`, "success");
            const shuffled = [...vocabularyData].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, Math.min(5, shuffled.length));
        } else {
            const shuffled = [...availableWords].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, Math.min(5, shuffled.length));
        }

        quizQuestions.forEach(q => {
            if (!quizHistory.includes(q.word)) quizHistory.push(q.word);
        });

        quizQuestions = quizQuestions.map(q => ({
            ...q,
            qType: Math.floor(Math.random() * 3)
        }));

        quizCurrentIndex = 0;
        quizScore = 0;

        document.getElementById('quiz-question-container').classList.remove('hidden');
        document.getElementById('quiz-result-container').classList.add('hidden');
        document.getElementById('quiz-title-text').innerText = `🎯 缩略语测验 - 第 ${quizRound + 1} 轮`;
        document.getElementById('quiz-modal').classList.remove('hidden');
        renderQuizQuestion();
    }

    function closeQuiz() {
        document.getElementById('quiz-modal').classList.add('hidden');
    }

    function renderQuizQuestion() {
        const currentQ = quizQuestions[quizCurrentIndex];
        const { question: currentQuestionText, answer: currentAnswerText } = splitWordItem(currentQ.word);
        
        document.getElementById('quiz-q-num').innerText = `题目 ${quizCurrentIndex + 1} / ${quizQuestions.length}`;
        const percent = (quizCurrentIndex / quizQuestions.length) * 100;
        document.getElementById('quiz-progress-bar').style.width = `${percent}%`;

        const questionWordEl = document.getElementById('quiz-question-word');
        const distractors = vocabularyData
            .filter(item => item.word !== currentQ.word)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3);

        const options = [currentQ, ...distractors].sort(() => 0.5 - Math.random());
        const optionsContainer = document.getElementById('quiz-options');

        if (currentQ.qType === 0) {
            questionWordEl.innerHTML = `
                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-sans font-medium">看原词选对应缩略语</span>
                <div class="text-base sm:text-lg font-bold font-serif text-stone-800 mt-2 px-2 leading-relaxed">${currentQuestionText}</div>
            `;
            optionsContainer.innerHTML = options.map(opt => {
                const isCorrect = (opt.word === currentQ.word);
                const { answer: optAnswer } = splitWordItem(opt.word);
                return `
                    <button onclick="handleQuizAnswer(this, ${isCorrect})" class="w-full text-left p-3.5 rounded-xl border-2 border-stone-100 hover:border-amber-400 hover:bg-amber-50/50 transition-all font-sans text-stone-700 text-sm leading-relaxed">
                        <span class="font-bold font-serif text-base text-stone-900 mr-1">${optAnswer ? '【' + optAnswer + '】' : ''}</span>${opt.defZh}
                    </button>
                `;
            }).join('');
        } else if (currentQ.qType === 1) {
            questionWordEl.innerHTML = `
                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-sans font-medium block w-max mx-auto mb-2">根据释义选对应词语</span>
                <p class="text-xs sm:text-sm font-medium font-sans px-4 text-stone-700 leading-relaxed text-left">${currentQ.defZh}</p>
            `;
            optionsContainer.innerHTML = options.map(opt => {
                const isCorrect = (opt.word === currentQ.word);
                const { question: optQ, answer: optA } = splitWordItem(opt.word);
                return `
                    <button onclick="handleQuizAnswer(this, ${isCorrect})" class="w-full text-center p-3 rounded-xl border-2 border-stone-100 hover:border-amber-400 hover:bg-amber-50/50 transition-all font-serif font-bold text-stone-800 text-xs sm:text-sm">
                        ${optA ? optA + '（' + optQ + '）' : optQ}
                    </button>
                `;
            }).join('');
        } else if (currentQ.qType === 2) {
            let exampleText = currentQ.example || '暂无例句。';
            const targetWord = currentAnswerText || currentQuestionText.replace(/\s+/g, '');
            if (targetWord && exampleText.includes(targetWord)) {
                exampleText = exampleText.replace(targetWord, ` ______ `);
            }
            questionWordEl.innerHTML = `
                <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-sans font-medium block w-max mx-auto mb-2">概述填空</span>
                <p class="text-xs sm:text-sm font-normal font-sans px-4 text-stone-700 leading-relaxed text-left">${exampleText}</p>
            `;
            optionsContainer.innerHTML = options.map(opt => {
                const isCorrect = (opt.word === currentQ.word);
                const { answer: optA, question: optQ } = splitWordItem(opt.word);
                return `
                    <button onclick="handleQuizAnswer(this, ${isCorrect})" class="w-full text-center p-3 rounded-xl border-2 border-stone-100 hover:border-amber-400 hover:bg-amber-50/50 transition-all font-serif font-bold text-stone-800 text-sm sm:text-base">
                        ${optA || optQ}
                    </button>
                `;
            }).join('');
        }
    }

    function handleQuizAnswer(buttonEl, isCorrect) {
        const allButtons = document.getElementById('quiz-options').querySelectorAll('button');
        allButtons.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            quizScore++;
            buttonEl.classList.remove('border-stone-100', 'hover:border-amber-400');
            buttonEl.classList.add('border-green-500', 'bg-green-50/60', 'text-green-800');
        } else {
            buttonEl.classList.remove('border-stone-100', 'hover:border-amber-400');
            buttonEl.classList.add('border-red-500', 'bg-red-50/60', 'text-red-800');
            allButtons.forEach(btn => {
                if (btn.getAttribute('onclick').includes('true')) {
                    btn.classList.add('border-green-500', 'bg-green-50/40');
                }
            });

            let wrongList = JSON.parse(localStorage.getItem('vocabulary_wrong_list')) || [];
            const currentQ = quizQuestions[quizCurrentIndex];
            if (!wrongList.some(item => item.word === currentQ.word)) {
                wrongList.push(currentQ);
                localStorage.setItem('vocabulary_wrong_list', JSON.stringify(wrongList));
                updateWeaknessButton(wrongList.length);
                updateMasteryProgress();
            }
        }

        setTimeout(() => {
            quizCurrentIndex++;
            if (quizCurrentIndex < quizQuestions.length) {
                renderQuizQuestion();
            } else {
                showQuizResults();
            }
        }, 1200);
    }

    function showQuizResults() {
        document.getElementById('quiz-progress-bar').style.width = `100%`;
        document.getElementById('quiz-question-container').classList.add('hidden');
        document.getElementById('quiz-result-container').classList.remove('hidden');

        document.getElementById('quiz-score').innerText = `${quizScore} / ${quizQuestions.length}`;
        let evaluation = "再接再厉，多刷刷闪卡吧！";
        if (quizScore === quizQuestions.length) {
            evaluation = "👑 太厉害了！满分通关！";
        } else if (quizScore >= 4) {
            evaluation = "🌟 优秀！底子非常扎实！";
        } else if (quizScore >= 3) {
            evaluation = "👍 及格啦，答错的词已经自动帮你放入错题库啰！";
        }
        
        const remaining = vocabularyData.filter(item => !quizHistory.includes(item.word)).length;
        evaluation += `<br><span class="text-[10px] text-stone-400">剩余 ${remaining} 个生词待测试</span>`;
        document.getElementById('quiz-eval').innerHTML = evaluation;
    }

    window.onload = function() {
        initApp();
    };
    </script>
</body>
</html>
